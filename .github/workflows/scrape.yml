name: Scrape Pittsburgh Auditions

on:
  schedule:
    # Daily at 8:00 AM ET (12:00 UTC, adjust seasonally if desired)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run agentic scraper
        run: python scrape_auditions.py

      - name: Commit updated auditions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auditions.json
          git diff --cached --quiet || git commit -m "chore: daily auditions refresh [skip ci]"
          git push
