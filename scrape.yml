name: Scrape Pittsburgh Auditions

on:
  schedule:
    # Runs every Monday and Thursday at 8am ET (12:00 UTC)
    - cron: "0 12 * * 1,4"
  workflow_dispatch:   # lets you also trigger it manually from GitHub UI

permissions:
  contents: write      # needed to commit auditions.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_auditions.py

      - name: Commit updated auditions.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auditions.json
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update auditions.json [skip ci]"
          git push
